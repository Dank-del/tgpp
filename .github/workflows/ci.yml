name: CI
on: [push, pull_request]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements-format.txt
      - run: python -m pip install -r tools/requirements-format.txt
      - run: python tools/format.py --check
      - run: python tools/generate.py --check
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements-format.txt
      - run: python -m pip install -r tools/requirements-format.txt
      - run: >-
          sudo apt-get update &&
          sudo apt-get install -y libcurl4-openssl-dev ninja-build
      - run: python3 tools/generate.py --check
      - run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_CXX_STANDARD=17
          -DTGPP_BUILD_EXAMPLES=ON
          -DTGPP_BUILD_BENCHMARKS=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: ./build/tgpp_dispatch_bench
