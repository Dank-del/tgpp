name: Update Telegram API

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-telegram-api
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements-format.txt
      - run: python -m pip install -r tools/requirements-format.txt

      - name: Refresh pinned schema and generated SDK
        run: python tools/generate.py --update-spec

      - name: Update README and detect changes
        id: changes
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re

          spec = json.loads(pathlib.Path("spec/api.json").read_text())
          path = pathlib.Path("README.md")
          text, count = re.subn(
              r"The pinned \*\*Bot API [^*]+\*\* schema produces \*\*\d+ types\*\* "
              r"\(including the\nhandwritten `InputFile` upload type\) and \*\*\d+ methods\*\*\.",
              f"The pinned **{spec['version']}** schema produces **{len(spec['types'])} types** "
              f"(including the\nhandwritten `InputFile` upload type) and "
              f"**{len(spec['methods'])} methods**.",
              path.read_text(),
          )
          if count != 1:
              raise SystemExit("Could not update the README schema summary")
          path.write_text(text)
          PY
          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Check formatting and reproducibility
        if: steps.changes.outputs.changed == 'true'
        run: |
          python tools/format.py --check
          python tools/generate.py --check
          python examples/async_showcase/generate.py --check

      - name: Install build dependencies
        if: steps.changes.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libsqlite3-dev ninja-build clang

      # GITHUB_TOKEN-created PRs do not trigger the normal push/PR CI.
      # Validate the candidate here before creating or updating its PR.
      - name: Build and test with GCC and Clang
        if: steps.changes.outputs.changed == 'true'
        run: |
          for compiler in g++ clang++; do
            build_dir="build-${compiler}"
            cmake -S . -B "$build_dir" -G Ninja \
              -DCMAKE_CXX_COMPILER="$compiler" \
              -DCMAKE_CXX_STANDARD=20 \
              -DTGPP_BUILD_EXAMPLES=ON \
              -DTGPP_BUILD_BENCHMARKS=ON \
              -DTGPP_WITH_WEBHOOK=ON -DTGPP_WITH_SQLITE=ON
            cmake --build "$build_dir" --parallel 2
            ctest --test-dir "$build_dir" --output-on-failure
            "$build_dir/tgpp_dispatch_bench"
          done

      - name: Create or update SDK update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: automation/update-telegram-api
          delete-branch: true
          commit-message: 'chore: update Telegram Bot API schema and SDK'
          title: 'chore: update Telegram Bot API schema and SDK'
          add-paths: |
            spec/
            include/tgpp/types.hpp
            include/tgpp/methods.hpp
            include/tgpp/async_methods.hpp
            include/tgpp/api_builders.hpp
            src/generated/
            README.md
          body: |
            Refreshes the pinned community Telegram Bot API schema and regenerates
            the C++ SDK. The README API version and surface counts are updated too.

            See `spec/lock.json` for the upstream commit, API version, and checksum.
            Upstream: https://github.com/PaulSonOfLars/telegram-bot-api-spec

            Validation before this PR was created/updated:
            - Formatting and reproducible generation
            - C++20 builds, tests, and dispatch benchmark with GCC and Clang

            Review compatibility before merging. This workflow does not publish releases.
            The default GITHUB_TOKEN does not trigger push/pull_request CI; validation
            runs in the Update Telegram API workflow instead.
